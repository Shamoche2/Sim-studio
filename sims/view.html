<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation</title>
  <link rel="stylesheet" href="kit/kit.css">
</head>
<body>
  <script src="kit/kit.js"></script>
  <script>
    // Loads one page: view.html?sim=physics/pendulum, view.html?lab=physics/pendulum or view.html?sim=tools/molecule-builder
    (function () {
      const q = new URLSearchParams(location.search), sim = q.get("sim") || "", lab = q.get("lab") || "";
      const id = lab || sim, valid = /^[a-z]+\/[a-z0-9-]+$/.test(id);
      if (!valid) {
        document.body.innerHTML = "<main><h1>Simulation not found</h1><p>Go back to the library and pick a topic.</p></main>";
        return;
      }
      const subject = id.split("/")[0];
      // Helpers first (missing ones are skipped), then the page itself, then the Learning Support toolbar.
      const optional = ["howto/" + subject + ".js", "easy/" + subject + ".js", "extras.js"].concat(lab ? ["kit/lab.js"] : []).concat(subject === "tools" || lab ? ["../catalog.js"] : []);
      const page = lab ? "labs/" + id + ".js" : id + ".js";
      function load(src, required, next) {
        const el = document.createElement("script");
        el.src = src;
        el.onload = next;
        el.onerror = required ? () => (document.body.innerHTML = "<main><h1>Simulation not found</h1></main>") : next;
        document.body.append(el);
      }
      (function chain(i) {
        if (i < optional.length) return load(optional[i], false, () => chain(i + 1));
        load(page, true, () => load("kit/support.js", false, () => {}));
      })(0);
    })();
  </script>
</body>
</html>
