<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulation</title>
  <link rel="stylesheet" href="kit/kit.css">
</head>
<body>
  <script src="kit/kit.js"></script>
  <script>
    // Loads one simulation script: view.html?sim=physics/pendulum
    (function () {
      const id = new URLSearchParams(location.search).get("sim") || "";
      if (!/^[a-z]+\/[a-z0-9-]+$/.test(id)) {
        document.body.innerHTML = "<main><h1>Simulation not found</h1><p>Go back to the library and pick a topic.</p></main>";
        return;
      }
      const script = document.createElement("script");
      script.src = id + ".js";
      script.onerror = () => (document.body.innerHTML = "<main><h1>Simulation not found</h1></main>");
      document.body.append(script);
    })();
  </script>
</body>
</html>
